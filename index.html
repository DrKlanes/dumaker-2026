<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>dumaker</title>
	<meta name="description" content="dumaker — dibujo, animación, juegos y universos por conocer.">
	<meta name="theme-color" content="#0a0908">
	<link rel="preload" href="assets/fonts/chivo-mono-var-latin.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="stylesheet" href="css/tokens.css">
	<link rel="stylesheet" href="css/base.css">
	<link rel="stylesheet" href="css/layout.css">
	<link rel="stylesheet" href="css/components.css">
</head>
<body>
	<div class="page">

		<header class="strip strip--hero">
			<img class="hero__logo" src="assets/logo-lockup.svg" alt="dumaker" width="320" height="140">
		</header>

		<nav class="strip strip--menu" aria-label="Proyectos">
			<ul class="menu"><!-- renderizado desde data/cards.json --></ul>
		</nav>

		<section class="strip strip--cards" aria-roledescription="carrusel" aria-label="Proyectos">
			<ul class="track"><!-- renderizado desde data/cards.json --></ul>
		</section>

		<section class="strip strip--claim" aria-label="Claim">
			<p class="claim"><b>Dibujo.</b> todo gira en torno a eso. a veces esos dibujos se <b>mueven.</b> o se <b>juegan.</b> o dan forma a un <b>universo</b> por conocer.</p>
		</section>

		<footer class="strip strip--footer">
			<a class="footer__link" href="#">Instagram</a>
			<span class="footer__sep" aria-hidden="true"></span>
			<a class="footer__link" href="#">Ko-fi</a>
		</footer>

	</div>

	<!-- Plantillas de card. El contenido viene de data/cards.json; aquí solo vive el marcado. -->
	<template id="tpl-card-texto">
		<li class="card card--texto">
			<h2 class="card__title"><b data-slot="number"></b><a class="card__link" data-slot="link"><span data-slot="title"></span></a></h2>
			<p class="card__sub" data-slot="sub"></p>
		</li>
	</template>

	<template id="tpl-card-poster">
		<li class="card card--poster">
			<div class="card__media">
				<img data-slot="img" loading="lazy" decoding="async" alt="">
			</div>
			<h2 class="card__title"><b data-slot="number"></b><a class="card__link" data-slot="link"><span data-slot="title"></span></a></h2>
			<p class="card__sub" data-slot="sub"></p>
		</li>
	</template>

	<template id="tpl-card-clip">
		<li class="card card--clip">
			<div class="card__media">
				<video data-slot="video" muted playsinline loop preload="none"></video>
			</div>
			<h2 class="card__title"><b data-slot="number"></b><a class="card__link" data-slot="link"><span data-slot="title"></span></a></h2>
			<p class="card__sub" data-slot="sub"></p>
		</li>
	</template>

	<script type="module" src="js/main.js"></script>
</body>
</html>
