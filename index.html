<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>dumaker</title>
	<meta name="description" content="dumaker — dibujo, animación, juegos y universos por conocer.">
	<meta name="theme-color" content="#0a0908">
	<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
	<link rel="preload" href="assets/fonts/chivo-mono-var-latin.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="stylesheet" href="css/tokens.css">
	<link rel="stylesheet" href="css/base.css">
	<link rel="stylesheet" href="css/layout.css">
	<link rel="stylesheet" href="css/components.css">
</head>
<body>
	<div class="page">

		<header class="strip strip--hero">
			<a class="hero__home" href="#ahora" aria-label="dumaker — volver al inicio">
				<img class="hero__logo" src="assets/logo-lockup.svg" alt="dumaker" width="320" height="140">
			</a>
		</header>

		<nav class="strip strip--menu" aria-label="Proyectos">
			<ul class="menu"><!-- renderizado desde data/cards.json --></ul>
		</nav>

		<main class="strip strip--cards" aria-roledescription="carrusel" aria-label="Proyectos">
			<ul class="track" tabindex="0"><!-- renderizado desde data/cards.json --></ul>
		</main>

		<section class="strip strip--claim" aria-label="Claim">
			<p class="claim"><b>Dibujo.</b> todo gira en torno a eso. a veces esos dibujos se <b>mueven.</b> o se <b>juegan.</b> o dan forma a un <b>universo</b> por conocer.</p>
		</section>

		<footer class="strip strip--footer">
			<a class="footer__link" href="https://www.instagram.com/dumaker/" target="_blank" rel="noopener">Instagram</a>
			<span class="footer__sep" aria-hidden="true"></span>
			<a class="footer__link" href="https://ko-fi.com/dumaker" target="_blank" rel="noopener">Ko-fi</a>
		</footer>

		<!-- Preloader: tapa el montaje de los strips; el marco+panel+grano son
		     los del propio .page (cero salto al fundir). main.js añade
		     .is-loaded cuando todo está listo (o un tope de seguridad). -->
		<div class="preloader" data-preloader aria-hidden="true">
			<img class="preloader__logo" src="assets/favicon.svg" alt="" width="64" height="51">
		</div>

	</div>

	<!-- Plantillas de card. El contenido viene de data/cards.json; aquí solo vive el marcado. -->
	<template id="tpl-card-texto">
		<li class="card card--texto">
			<h2 class="card__title"><b data-slot="number"></b><a class="card__link" data-slot="link"><span data-slot="title"></span></a></h2>
			<p class="card__sub" data-slot="sub"></p>
		</li>
	</template>

	<template id="tpl-card-poster">
		<li class="card card--poster">
			<div class="card__media">
				<img data-slot="img" loading="lazy" decoding="async" alt="">
			</div>
			<h2 class="card__title"><b data-slot="number"></b><a class="card__link" data-slot="link"><span data-slot="title"></span></a></h2>
			<p class="card__sub" data-slot="sub"></p>
		</li>
	</template>

	<template id="tpl-card-clip">
		<li class="card card--clip">
			<div class="card__media">
				<video data-slot="video" muted playsinline loop preload="none"></video>
			</div>
			<h2 class="card__title"><b data-slot="number"></b><a class="card__link" data-slot="link"><span data-slot="title"></span></a></h2>
			<p class="card__sub" data-slot="sub"></p>
		</li>
	</template>

	<script type="module" src="js/main.js"></script>
</body>
</html>
